<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #191f28; background: #fff; font-synthesis: none; }
* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
button:focus-visible, input:focus-visible, section:focus-visible { outline: 3px solid #3182f6; outline-offset: 2px; }
.app-shell { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; max-width: 960px; margin: auto; padding-top: var(--toss-safe-area-top, env(safe-area-inset-top, 0px)); padding-bottom: var(--toss-safe-area-bottom, env(safe-area-inset-bottom, 0px)); }
.app-heading { display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; gap: 12px; padding: 44px 20px 12px; }
.app-heading h1 { font-size: 19px; letter-spacing: -.5px; }
.app-heading > span, .secondary { color: #6b7684; font-size: 13px; line-height: 1.6; }
.wallet-heading { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; font-size: 12px; color: #6b7684; }
.wallet-heading strong { color: #8b4c00; padding: 6px 10px; background: #fff8df; border-radius: 16px; white-space: nowrap; }
.hint-wallet { border: 0; padding: 0; background: transparent; }
.ad-banner { flex-shrink: 0; width: 100%; padding: 16px 0 0; border-top: 1px solid #f2f4f6; }
.ad-banner > div { width: 100%; height: 96px; }
.answer-actions > button { white-space: normal; }
.scroll-page { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 24px; }
.home-welcome { max-width: 448px; margin: 0 auto; text-align: center; padding-bottom: 8px; }
.home-title { padding: 12px; border-radius: 12px; color: #fff; background: #3182f6; font-size: 18px; font-weight: 700; }
.home-puzzle { display: grid; place-items: center; width: 128px; height: 128px; margin: 20px auto; border: 4px solid #fff; border-radius: 50%; background: #e8f3ff; box-shadow: 0 6px 20px #191f2814; }
.home-puzzle > div { display: grid; grid-template-columns: repeat(3, 28px); gap: 4px; }
.home-puzzle span { display: grid; place-items: center; height: 28px; background: #3182f6; border-radius: 4px; }
.home-puzzle .letter { color: #1b64da; background: #fff; font-size: 18px; font-weight: 800; }
.home-welcome h2 { font-size: 20px; line-height: 1.5; }
.home-description { margin-top: 12px; color: #6b7684; font-size: 14px; line-height: 1.6; }
.home-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.home-actions svg { vertical-align: middle; margin-right: 10px; }
.choices { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.choices > button { flex: 1; }
.word-filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.word-filters > button { min-width: 0; padding-left: 4px; padding-right: 4px; }
.bottom-navigation { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #f2f4f6; flex-shrink: 0; background: #fff; }
.bottom-navigation > button { flex: 1; min-width: 0; padding-left: 2px; padding-right: 2px; }
.bottom-navigation > button:not(:disabled) { background: transparent; color: #6b7684; }
.bottom-navigation > button[aria-current="page"] { color: #1b64da; }
.navigation-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
.quiz-page { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 0 16px 12px; }
.quiz-summary { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-bottom: 8px; }
.quiz-summary-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.quiz-summary-actions strong { color: #3182f6; font-size: 12px; white-space: nowrap; }
.quiz-summary-actions > button { min-width: 0; min-height: 30px; height: 30px; padding: 0 8px; font-size: 11px; white-space: nowrap; }
.quiz-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); flex-shrink: 0; gap: 8px; padding: 4px; margin-bottom: 8px; border: 1px solid #e5e8eb; border-radius: 12px; }
.quiz-controls > div { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; min-width: 0; }
.quiz-controls button { min-width: 0; min-height: 30px; height: 30px; padding: 0 3px; font-size: 11px; white-space: nowrap; }
.completion-reward-guide { flex: 1; min-width: 0; color: #1b64da; font-size: 11px; line-height: 1.6; }
.completion-reward-guide > span { color: #6b7684; }
.puzzle-layout { display: grid; grid-template-rows: minmax(0, 3fr) minmax(120px, 2fr); gap: 12px; flex: 1; min-height: 0; }
.board-area { min-height: 0; min-width: 0; container-type: size; display: grid; place-items: center; }
.board { display: grid; gap: 1px; padding: 4px; background: #d1d6db; border-radius: 8px; width: min(100cqw, 100cqh, 400px); aspect-ratio: 1; margin: auto; }
.cell { background: #fff; position: relative; display: flex; justify-content: center; align-items: center; aspect-ratio: 1; min-width: 0; overflow: hidden; font-size: clamp(11px, 2.7vw, 18px); font-weight: 700; }
.cell.blocked { background: #333d4b; }
.cell.solved { background: #e8f3ff; color: #1b64da; }
.cell small { position: absolute; top: 1px; left: 2px; font-size: 8px; color: #6b7684; line-height: 1; }
.cell span { padding-top: 5px; }
.clues { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 2px; }
.clue-headings, .clue-lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.clue-headings { flex-shrink: 0; padding-right: 8px; margin-bottom: 8px; }
.clue-lists { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; align-content: start; padding: 2px 2px 4px; scrollbar-gutter: stable; }
.clue-group { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.clue-headings h2 { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px; font-size: 16px; }
.clue-progress { margin-left: auto; font-size: 12px; font-weight: 400; color: #1b64da; white-space: nowrap; }
.clue-group > button { white-space: normal; height: auto; min-height: 48px; flex-shrink: 0; }
.clue-button { justify-content: flex-start; text-align: left; }
.clue-button > span { width: 100%; justify-content: flex-start; text-align: left; }
.clue-text { display: flex; gap: 6px; justify-content: space-between; align-items: center; width: 100%; text-align: left; overflow-wrap: anywhere; }
.clue-text small { white-space: nowrap; font-size: 11px; color: #6b7684; }
.clue-content { display: block; width: 100%; min-width: 0; text-align: left; }
.clue-synonym { display: block; margin-top: 5px; font-size: 12px; line-height: 1.5; font-weight: 400; color: #6d28d9; overflow-wrap: anywhere; }
.word-bank h2 { font-size: 24px; padding: 16px 0 20px; }
.word-bank-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 20px; }
.word-bank-heading h2 { padding: 0; }
.word-bank-heading > span { flex-shrink: 0; white-space: nowrap; }
.word-bank > .secondary { margin: 14px 0; }
.word-list { list-style: none; padding: 0; margin: 0; }
.word-list > li { display: flex; align-items: flex-start; gap: 12px; padding: 20px 0; border-top: 1px solid #f2f4f6; }
.word-list > li > div { flex: 1; min-width: 0; }
.word-list h3 { font-size: 20px; margin-bottom: 6px; }
.word-list small { color: #6b7684; font-size: 12px; }
.word-list p { margin-top: 8px; line-height: 1.6; }
.word-synonym { color: #6d28d9; overflow-wrap: anywhere; }
.example { color: #6b7684; line-height: 1.7; font-size: 14px; margin-top: 16px; }
.modal { border: 0; border-radius: 24px; padding: 24px; width: min(480px, calc(100% - 32px)); max-height: 85dvh; overflow-y: auto; color: #191f28; }
.modal::backdrop { background: #0009; }
.modal-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
.modal-heading h2 { font-size: 20px; }
.modal .meaning { font-size: 20px; font-weight: 700; line-height: 1.5; margin-bottom: 8px; }
.modal form { margin-top: 20px; }
.form-action { margin-top: 20px; }
.answer-modal { text-align: center; }
.answer-modal .modal-heading { position: relative; justify-content: center; padding: 0 44px; }
.answer-modal .modal-heading h2 { color: #6d28d9; font-size: 15px; }
.answer-modal .modal-heading > button { position: absolute; right: 0; }
.answer-synonym { margin-top: 12px; color: #6d28d9; font-size: 14px; overflow-wrap: anywhere; }
.answer-cells { display: grid; width: 100%; gap: 4px; margin: 16px auto 12px; }
.answer-cell { width: 100%; min-width: 0; height: 48px; border: 2px solid #e5e8eb; border-radius: 8px; background: #f9fafb; text-align: center; padding: 0; font-size: clamp(16px, 4vw, 24px); font-weight: 700; color: #191f28; }
.answer-cell:focus { outline: none; border-color: #6d28d9; }
.answer-cell[readonly] { background: #e8f3ff; color: #1b64da; }
.answer-cell.incorrect { border-color: #e2293b; background: #fff1f1; color: #b91c1c; }
.answer-cell.incorrect:focus { outline: 2px solid #e2293b; outline-offset: 1px; }
.answer-guidance { color: #6b7684; font-size: 11px; line-height: 1.5; margin-bottom: 12px; }
.answer-actions { display: flex; gap: 10px; }
.answer-actions > button { flex: 1; min-width: 0; }
.modal > p { line-height: 1.7; }
.review { list-style: none; padding: 0; margin: 20px 0; }
.review li { padding: 12px 0; border-bottom: 1px solid #f2f4f6; }
.review span { display: block; font-size: 14px; color: #6b7684; margin-top: 4px; }
.error { color: #c82828; font-size: 14px; line-height: 1.7; margin: 12px 0; }
.save-error { flex-shrink: 0; background: #fff1f1; padding: 12px 20px; color: #c82828; font-size: 13px; }
.save-error p { margin-bottom: 8px; }
.empty, .startup { padding: 32px 20px; text-align: center; line-height: 1.7; }
.empty p, .startup p { margin: 16px 0; }
.picture-books h2, .settings-page h2 { margin: 16px 0; font-size: 24px; }
.picture-books-heading { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.picture-books-heading h2 { flex-shrink: 0; margin: 0; }
.picture-books-heading > p { min-width: 0; }
.picture-books .choices { margin-top: 8px; }
.picture-books h3 { margin: 16px 0; font-size: 20px; }
.picture-books article img { display: block; width: 100%; max-width: 640px; height: auto; margin: 16px auto; }
.book-page-visual { position: relative; max-width: 640px; margin: 16px auto; }
.picture-books .book-page-visual img { margin: 0; }
.image-page-navigation { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; pointer-events: none; }
.picture-books .page-arrow { flex-shrink: 0; width: 44px; min-width: 44px; height: 48px; padding: 0; border: 1px solid #d1d6db; border-radius: 24px; background: #ffffffed; color: #1b64da; box-shadow: 0 2px 8px #191f2826; pointer-events: auto; }
.picture-books .page-arrow:disabled { opacity: .35; pointer-events: none; }
.picture-books details { margin: 16px 0; padding: 16px; border: 1px solid #e5e8eb; border-radius: 12px; }
.picture-books summary { cursor: pointer; font-weight: 700; }
.picture-books details p { white-space: pre-line; line-height: 1.8; margin-top: 12px; }
.reading-actions { display: flex; justify-content: space-between; gap: 12px; margin: 20px 0; }
.picture-books .reading-actions > button { flex: 1; min-width: 0; white-space: nowrap; }
.book-list { list-style: none; padding: 0; display: grid; gap: 12px; }
.book-list button { white-space: normal; }
.settings-page h3 { margin: 28px 0 12px; font-size: 16px; }
.settings-page p { margin: 12px 0; line-height: 1.7; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (orientation: landscape) {
  .puzzle-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
}
